<!-- PERSONALIZAR -->

    <section class="personaliza" id="personaliza">

        <h2>Personaliza tu antojo</h2>

        <div class="personalizar-container">

            <div>
                <h3>Escoge tus toppings</h3>

                <label>
                    <input type="checkbox" name="topping" value="Barquillos">
                    Barquillos
                </label>

                <label>
                    <input type="checkbox" name="topping" value="Gomitas">
                    Gomitas
                </label>

                <label>
                    <input type="checkbox" name="topping" value="Galletas">
                    Galletas
                </label>

                <label>
                    <input type="checkbox" name="topping" value="masmellos">
                    Masmellos
                </label>
                 <label>
                    <input type="checkbox" name="topping" value="Queso">
                    Queso
                </label>
            </div>


            <div>
                <h3>Escoge tu salsa</h3>

                <label>
                    <input type="radio" name="salsa" value="Chocolate">
                    Chocolate
                </label>

                <label>
                    <input type="radio" name="salsa" value="Arequipe">
                    Arequipe
                </label>

                <label>
                    <input type="radio" name="salsa" value="Fresa">
                    Fresa
                </label>

                <label>
                    <input type="radio" name="salsa" value="mora">
                    mora
                </label>
            </div>

        </div>

        <button class="confirmar" onclick="personalizar()">
            Confirmar pedido
        </button>

        <script src="script.js"></script>

    </section>
